name: Godot

on:
  pull_request:
    paths:
      - ".github/workflows/godot.yml"
      - ".gitmodules"
      - "Godot/**"
      - "Proto/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/godot.yml"
      - ".gitmodules"
      - "Godot/**"
      - "Proto/**"

permissions:
  contents: read

jobs:
  format:
    name: Godot / format
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format 17
        run: python3 -m pip install --disable-pip-version-check clang-format==17.0.6

      - name: Check formatting
        run: |
          git ls-files ':(glob)Godot/**/*.cpp' ':(glob)Godot/**/*.h' \
            | xargs clang-format --dry-run --Werror

  build:
    name: Godot / build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Godot/requirements.txt

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r Godot/requirements.txt

      - name: Build debug extensions
        run: scons -C Godot platform=linux target=template_debug -j2

      - name: Build and run core unit tests
        run: |
          scons -C Godot unit_tests platform=linux target=template_debug -j2
          ./Godot/build/tests/schola_core_tests

      - name: Upload extensions
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-debug
          path: Godot/addons/*/bin/linux/*.so
          if-no-files-found: error

  smoke:
    name: Godot / smoke
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download extensions
        uses: actions/download-artifact@v4
        with:
          name: godot-linux-debug
          path: Godot/addons

      - name: Download Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" \
            | sha256sum --check --strict
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Install Godot test dependencies
        run: python Godot/tools/setup_test_dependencies.py

      - name: Import project resources
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot --import

      - name: Load extension and example scene
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot --quit-after 1

      - name: Run Godot integration tests
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -a res://tests/integration
