name: Godot

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Godot changes
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      godot: ${{ steps.filter.outputs.godot }}
    steps:
      - name: Detect relevant paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          relevant=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            relevant=false
            gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[].filename' > changed-files.txt
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/godot.yml|.github/workflows/d3-release.yml|.gitmodules|Godot/*|Proto/*)
                  relevant=true
                  break
                  ;;
              esac
            done < changed-files.txt
          fi
          echo "godot=$relevant" >> "$GITHUB_OUTPUT"

  format:
    name: Godot / format
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format 17
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r Godot/requirements-format.txt

      - name: Check formatting
        run: |
          git ls-files ':(glob)Godot/**/*.cpp' ':(glob)Godot/**/*.h' \
            | xargs clang-format --dry-run --Werror

  build:
    name: Godot / build
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-22.04
    # A cold gRPC build takes most of this; cached runs finish in about 15 minutes.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          lfs: true
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: Godot/vendor/grpc/linux-x86_64.zip

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Godot/requirements.txt

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r Godot/requirements.txt

      - name: Verify dependency pins
        run: python Godot/tools/verify_dependency_pins.py

      - name: Test dependency installer and build target isolation
        run: |
          python -m unittest discover -s Godot/tools -p test_setup_grpc.py -v
          python -m unittest discover -s Godot/tools -p test_build_targets.py -v

      - name: Install committed gRPC and protobuf
        run: python Godot/tools/setup_grpc.py

      - name: Verify gRPC generators and static libraries
        run: python Godot/tools/verify_grpc_package.py

      - name: Cache ONNX Runtime
        id: onnx-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Godot/thirdparty/onnxruntime
          key: onnxruntime-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Godot/dependencies.lock.json', 'Godot/tools/setup_onnxruntime.py') }}

      - name: Install ONNX Runtime
        if: steps.onnx-cache.outputs.cache-hit != 'true'
        run: python Godot/tools/setup_onnxruntime.py

      - name: Identify compiler for build cache
        id: compiler
        run: |
          echo "SCONS_CACHE=$RUNNER_TEMP/schola-scons-cache" >> "$GITHUB_ENV"
          echo "hash=$(g++ --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Godot/requirements.txt', 'Godot/dependencies.lock.json', 'Godot/SConstruct') }}-${{ github.sha }}
          # SCons checks input and command signatures before reusing each output.
          # Older configurations can still supply unchanged godot-cpp objects.
          restore-keys: |
            scons-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Godot/requirements.txt', 'Godot/dependencies.lock.json', 'Godot/SConstruct') }}-
            scons-v1-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.compiler.outputs.hash }}-

      - name: Build debug extensions
        run: scons -C Godot platform=linux target=template_debug integration_tests=yes -j2

      - name: Build and run core unit tests
        run: |
          scons -C Godot unit_tests platform=linux target=template_debug integration_tests=yes -j2
          ./Godot/build/tests/schola_core_tests

      - name: Build and run inference tests
        run: |
          scons -C Godot inference_tests platform=linux target=template_debug integration_tests=yes -j2
          ./Godot/build/tests/schola_inference_tests

      - name: Build and run transport tests
        run: |
          scons -C Godot transport_tests platform=linux target=template_debug integration_tests=yes -j2
          ./Godot/build/tests/schola_transport_tests

      - name: Upload extensions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-linux-debug
          # *.so.* includes libonnxruntime.so.1, which libschola.so loads at startup.
          path: |
            Godot/addons/*/bin/linux/*.so
            Godot/addons/*/bin/linux/*.so.*
          if-no-files-found: error

  prebuilt-windows:
    name: Godot / Windows prebuilt dependency
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: Godot/vendor/grpc/windows-x86_64.zip

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Enable MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in 'PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VSINSTALLDIR','WindowsSdkDir','WindowsSDKVersion') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }

      - name: Test installer
        run: python -m unittest discover -s Godot/tools -p test_setup_grpc.py -v

      - name: Install committed gRPC and protobuf
        run: python Godot/tools/setup_grpc.py

      - name: Verify gRPC generators and static libraries
        run: python Godot/tools/verify_grpc_package.py

  smoke:
    name: Godot / smoke
    needs: [changes, build]
    if: >-
      always() &&
      needs.changes.outputs.godot == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Godot/demo/d3/python/requirements.txt

      - name: Download extensions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: godot-linux-debug
          path: Godot/addons

      - name: Cache Godot download
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: godot.zip
          key: godot-linux-x86_64-4.7.2-cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

      - name: Download Godot 4.7.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip

      - name: Verify and unpack Godot
        run: |
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" \
            | sha256sum --check --strict
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Cache Godot test dependencies
        id: gdunit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Godot/addons/gdUnit4
          key: gdunit4-v1-${{ hashFiles('Godot/dependencies.lock.json', 'Godot/tools/setup_test_dependencies.py') }}

      - name: Install Godot test dependencies
        if: steps.gdunit-cache.outputs.cache-hit != 'true'
        run: python Godot/tools/setup_test_dependencies.py

      - name: Import project resources
        run: |
          # Godot can abort while unloading editor add-ons after a completed
          # headless import (godotengine/godot#98062). A retry reuses the
          # completed import cache; persistent import failures still fail CI.
          ulimit -c 0
          for attempt in 1 2 3; do
            set +e
            timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot --import
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "::warning::Godot import exited with status $status; retrying ($attempt/3)"
          done

      - name: Load extension and example scene
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot --quit-after 1

      - name: Run Godot integration tests
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -a res://tests/integration

      - name: Prepare D3 demo and reference policy
        run: |
          python3 -m pip install --disable-pip-version-check -r Godot/demo/d3/python/requirements.txt
          mkdir -p Godot/demo/d3/addons/schola/bin/linux
          cp Godot/addons/schola/bin/linux/*.so* Godot/demo/d3/addons/schola/bin/linux/
          python3 Godot/demo/d3/python/create_reference_policy.py
          python3 Godot/demo/d3/python/export_onnx.py
          test -s Godot/demo/d3/policies/q_policy.onnx

      - name: Import D3 demo
        run: |
          # The first import can abort during GDExtension shutdown after writing
          # its cache, just as for the main project's import above.
          ulimit -c 0
          for attempt in 1 2 3; do
            set +e
            timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot/demo/d3 --editor --quit
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$status" -ne 134 ] || [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "::warning::D3 import aborted during shutdown; retrying with its generated cache ($attempt/3)"
          done

      - name: Run D3 host and ONNX smoke check
        run: timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot/demo/d3 -s res://tests/d3_smoke.gd -- --require-policy --expect-success

      - name: Verify parallel training and ONNX export
        run: |
          timeout 120s python3 Godot/demo/d3/python/train_parallel.py \
            --godot "$PWD/Godot_v4.7.2-stable_linux.x86_64" --instances 2 --episodes 20
          python3 -c 'import json; from pathlib import Path; p = Path("Godot/demo/d3/policies"); assert json.loads((p / "q_policy.json").read_text())["episodes"] == 20; assert (p / "q_policy.onnx").stat().st_size > 0'
          timeout 60s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path Godot/demo/d3 -s res://tests/d3_smoke.gd -- --require-policy

      - name: Upload D3 training diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d3-training-logs
          path: Godot/demo/d3/python/logs/
          if-no-files-found: ignore

  packages:
    name: Godot / D3 packages
    needs: [changes, format, build, prebuilt-windows, smoke]
    if: needs.changes.outputs.godot == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/d3-release.yml

  required:
    name: Godot / required
    needs: [changes, format, build, prebuilt-windows, smoke, packages]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - name: Verify required jobs
        env:
          RELEVANT: ${{ needs.changes.outputs.godot }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WINDOWS_RESULT: ${{ needs.prebuilt-windows.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed with result: $CHANGES_RESULT"
            exit 1
          fi

          if [ "$RELEVANT" != "true" ]; then
            echo "No Godot-related changes; required checks are not applicable."
            exit 0
          fi

          failed=false
          for result in \
            "format:$FORMAT_RESULT" \
            "build:$BUILD_RESULT" \
            "windows-prebuilt:$WINDOWS_RESULT" \
            "smoke:$SMOKE_RESULT" \
            "packages:$PACKAGES_RESULT"; do
            name=${result%%:*}
            status=${result#*:}
            if [ "$status" != "success" ]; then
              echo "$name did not succeed: $status"
              failed=true
            fi
          done

          if [ "$failed" = "true" ]; then
            exit 1
          fi
