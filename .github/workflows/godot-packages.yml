name: Godot plugin packages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: godot-packages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Plugin / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-2022
            platform: windows
            arch: x86_64
            editor_asset: Godot_v4.7.2-stable_win64.exe.zip
            editor_sha256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
            editor_path: Godot_v4.7.2-stable_win64.exe
          - name: Linux x86_64
            runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            editor_asset: Godot_v4.7.2-stable_linux.x86_64.zip
            editor_sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
            editor_path: Godot_v4.7.2-stable_linux.x86_64
          - name: macOS arm64
            runner: macos-15
            platform: macos
            arch: arm64
            editor_asset: Godot_v4.7.2-stable_macos.universal.zip
            editor_sha256: c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e
            editor_path: Godot.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          lfs: true
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: Godot/vendor/onnxruntime/${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Godot/requirements.txt

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r Godot/requirements.txt

      - name: Configure SCons cache
        id: build-cache
        shell: pwsh
        run: |
          "SCONS_CACHE=$env:RUNNER_TEMP/schola-plugin-scons" >> $env:GITHUB_ENV
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Cache native build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: plugin-scons-v1-${{ runner.os }}-${{ matrix.arch }}-${{ steps.build-cache.outputs.image }}-${{ hashFiles('Godot/dependencies.lock.json', 'Godot/requirements.txt', 'Godot/SConstruct') }}-${{ github.sha }}
          restore-keys: |
            plugin-scons-v1-${{ runner.os }}-${{ matrix.arch }}-${{ steps.build-cache.outputs.image }}-${{ hashFiles('Godot/dependencies.lock.json', 'Godot/requirements.txt', 'Godot/SConstruct') }}-

      - name: Build release extension
        shell: pwsh
        run: |
          python Godot/tools/setup_onnxruntime.py
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime setup failed" }
          scons -C Godot schola platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug -j2
          if ($LASTEXITCODE -ne 0) { throw "Debug runtime build failed" }
          scons -C Godot schola platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release -j2
          if ($LASTEXITCODE -ne 0) { throw "Release runtime build failed" }

      - name: Package runtime and editor add-on
        shell: pwsh
        run: python Godot/tools/package_plugin.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output dist/Schola-Godot-${{ matrix.platform }}-${{ matrix.arch }}.zip

      - name: Download pinned Godot editor
        shell: pwsh
        run: |
          $release = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          Invoke-WebRequest "$release/${{ matrix.editor_asset }}" -OutFile godot-editor.zip
          if ((Get-FileHash godot-editor.zip -Algorithm SHA256).Hash.ToLower() -ne "${{ matrix.editor_sha256 }}") {
            throw "Godot editor checksum mismatch"
          }
          Expand-Archive godot-editor.zip -DestinationPath godot-editor

      - name: Load packaged plugin in a clean project
        timeout-minutes: 5
        shell: pwsh
        run: |
          Expand-Archive dist/Schola-Godot-${{ matrix.platform }}-${{ matrix.arch }}.zip -DestinationPath plugin-check
          @'
          config_version=5
          [application]
          config/name="Schola package check"
          [editor_plugins]
          enabled=PackedStringArray("res://addons/schola/plugin.cfg")
          [rendering]
          renderer/rendering_method="gl_compatibility"
          '@ | Set-Content plugin-check/project.godot
          @'
          extends SceneTree
          func _initialize():
              for type_name in ["ScholaEnvironment", "ScholaAgent", "ScholaTrainingHost", "ScholaOnnxPolicy", "ScholaInferenceStepper"]:
                  if not ClassDB.class_exists(type_name):
                      push_error("Package is missing native class: " + type_name)
                      quit(1)
                      return
              print("Schola plugin package loaded")
              quit(0)
          '@ | Set-Content plugin-check/check.gd
          $editor = (Resolve-Path "godot-editor/${{ matrix.editor_path }}").Path
          if ($env:RUNNER_OS -ne "Windows") { chmod +x $editor }
          # Retry only the known first-import shutdown crash, never persistent failures.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $launch = @{ FilePath = $editor; ArgumentList = @("--headless", "--path", "plugin-check", "--import"); Wait = $true; PassThru = $true }
            if ($env:RUNNER_OS -eq "Windows") { $launch.WindowStyle = "Hidden" }
            $process = Start-Process @launch
            if ($process.ExitCode -eq 0) { break }
            if ($process.ExitCode -notin @(134, -1073741819) -or $attempt -eq 3) { throw "Package import failed: $($process.ExitCode)" }
          }
          $launch.ArgumentList = @("--headless", "--path", "plugin-check", "-s", "res://check.gd")
          $process = Start-Process @launch
          if ($process.ExitCode -ne 0) { throw "Packaged plugin load check failed: $($process.ExitCode)" }

      - name: Upload plugin package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schola-plugin-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/Schola-Godot-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error
